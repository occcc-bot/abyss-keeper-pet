name: Build & Release Windows + Web

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows Portable (.exe) & HTML5 Web Bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies & build frontend
        run: |
          npm ci
          npm run build

      - name: Build native Windows binary (Tauri v2)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package Win64 Portable & HTML5 Web zips + SHA256
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "v2.5.0" }
          New-Item -ItemType Directory -Force -Path release_out/win64 | Out-Null
          Copy-Item src-tauri/target/release/keeper-pet.exe release_out/win64/keeper-pet.exe
          Copy-Item LICENSE release_out/win64/LICENSE.txt
          @"
          Abyss Keeper Pet ($ver) — Portable Windows Desktop Pet
          ======================================================
          1. Double-click keeper-pet.exe to dock the dungeon above your taskbar.
          2. Transparent sky above the dungeon is 100% click-through.
          3. Unsigned open-source build note: if Windows SmartScreen appears,
             click "More info" -> "Run anyway".
          "@ | Set-Content -Encoding UTF8 release_out/win64/README-FIRST.txt

          Compress-Archive -Path release_out/win64/* -DestinationPath "release_out/AbyssKeeperPet-$ver-Win64.zip" -Force
          Compress-Archive -Path dist/* -DestinationPath "release_out/AbyssKeeperPet-$ver-HTML5-Web.zip" -Force

          $hashes = Get-ChildItem release_out/*.zip, src-tauri/target/release/keeper-pet.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $hashes | Set-Content -Encoding UTF8 release_out/SHA256SUMS.txt
          Get-Content release_out/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abyss-keeper-pet-bundles
          path: |
            release_out/*.zip
            release_out/SHA256SUMS.txt

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_out/*.zip
            release_out/SHA256SUMS.txt
          generate_release_notes: true
